*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:#eaf4f9;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(176deg,#04273b 0%,#073c58 48%,#042c42 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1100px 620px at 50% -180px,rgba(232,181,60,.22),transparent 62%),radial-gradient(820px 640px at 112% 106%,rgba(12,109,148,.6),transparent 66%)}
.wrap{max-width:560px;margin:0 auto;padding:34px 18px 40px;text-align:center}
.logos{display:flex;align-items:center;justify-content:center;gap:16px}.logo.crest{border-radius:0;height:92px;width:auto}
.logo{height:92px;width:auto;border-radius:16px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));animation:drop .7s ease-out both,float 5s ease-in-out .8s infinite}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0 14px}.orn i{display:block;height:1px;width:64px;background:linear-gradient(90deg,transparent,#e8b53c)}.orn i+i{background:linear-gradient(90deg,#e8b53c,transparent)}.orn s{width:9px;height:9px;background:#e8b53c;transform:rotate(45deg);box-shadow:0 0 12px rgba(232,181,60,.75)}
.kick{display:block;font-weight:800;font-size:.68rem;letter-spacing:.3em;color:#e8b53c;text-indent:.3em}
h1{margin:10px 0 6px;font-weight:800;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.08;background:linear-gradient(100deg,#fff 18%,#ffeab4 38%,#e8b53c 50%,#ffeab4 62%,#fff 82%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.sub{margin:0 0 30px;color:#9fc0d2;font-size:.92rem}
.q{margin:0 0 14px;font-weight:700;font-size:1.02rem}
.card{display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:#fff;margin:0 0 14px;padding:20px 18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(232,181,60,.35);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:up .6s ease-out both;transition:transform .2s,border-color .2s}
.card:nth-of-type(2){animation-delay:.12s}.card:active{transform:scale(.98)}.card:hover{border-color:#e8b53c;transform:translateY(-2px)}
.ic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd97a,#e8b53c);color:#04273b;box-shadow:0 0 0 0 rgba(232,181,60,.5);animation:pulse 2.6s ease-out infinite}
.ic svg{width:28px;height:28px}
.tx{flex:1}.tx b{display:block;font-size:1.12rem}.tx small{color:#b9d3e0;font-size:.84rem}
.go{flex:none;color:#e8b53c;animation:nudge 1.6s ease-in-out infinite}.go svg{width:22px;height:22px}
footer{margin-top:34px;font-size:.78rem;color:#9fc0d2;line-height:1.7}footer a{color:#cfe4ee;text-decoration:none}footer a:hover{text-decoration:underline}.sep{margin:0 8px;opacity:.5}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:-260% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,181,60,.5)}70%,100%{box-shadow:0 0 0 14px rgba(232,181,60,0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
